<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Adarsha Indian Restaurant">
  <defs>
    <path id="topArc" d="M 28,100 A 72,72 0 0 1 172,100" fill="none" />
    <path id="bottomArc" d="M 172,100 A 72,72 0 0 1 28,100" fill="none" />
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="98" fill="#6b3f2a" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="#ffffff" stroke-width="2.2" />
  <circle cx="100" cy="100" r="88" fill="#6b3f2a" />

  <!-- Top curved English -->
  <text fill="#ffffff" font-size="11.5" font-weight="700" letter-spacing="2.2"
        font-family="Helvetica Neue, Helvetica, Arial, 'Hiragino Sans', sans-serif">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">INDIAN RESTAURANT</textPath>
  </text>

  <!-- English brand -->
  <text x="100" y="78" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700"
        letter-spacing="3.5"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif">ADARSHA</text>

  <!-- Divider ticks -->
  <line x1="30" y1="100" x2="48" y2="100" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="152" y1="100" x2="170" y2="100" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Japanese brand -->
  <text x="100" y="118" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="900"
        font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif"
        letter-spacing="2">アダルサ</text>

  <!-- Bottom curved Japanese -->
  <text fill="#ffffff" font-size="12" font-weight="700" letter-spacing="1.5"
        font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">インドレストラン</textPath>
  </text>
</svg>
